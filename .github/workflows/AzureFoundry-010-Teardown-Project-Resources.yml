name: AzureFoundry-010-Teardown-Project-Resources

# Soft teardown: removes agents + HR memory store in the Foundry project.
# Does NOT delete the Cognitive Services / Foundry account (models may still bill).
# For cost stop overnight, also run AzureFoundry-011-Teardown-Foundry-Account.

on:
  workflow_dispatch:
    inputs:
      memory_store_name:
        description: Memory store name to delete
        required: true
        default: hr-joiner-memory
      still_run:
        description: Delete ALL project agents + HR memory store? Confirm with yes.
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: foundry-project-teardown
  cancel-in-progress: false

jobs:
  teardown:
    name: Delete agents and memory store
    if: inputs.still_run == 'yes'
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
      MEMORY_STORE_NAME: ${{ inputs.memory_store_name }}
    steps:
      - name: Delete project resources
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FOUNDRY_PROJECT_ENDPOINT}" ] || [ -z "${FOUNDRY_API_KEY}" ]; then
            echo "Add FOUNDRY_PROJECT_ENDPOINT and FOUNDRY_API_KEY as repository secrets."
            exit 1
          fi
          endpoint="${FOUNDRY_PROJECT_ENDPOINT%/}"
          FEATURE_HEADER="Foundry-Features: MemoryStores=V1Preview"
          failed=0

          delete_agent() {
            local name="$1"
            local status
            status=$(curl -sS -o "/tmp/delete-${name}.json" -w "%{http_code}" \
              -X DELETE "${endpoint}/agents/${name}?api-version=v1" \
              -H "api-key: ${FOUNDRY_API_KEY}" \
              -H "Accept: application/json")
            echo "agent=${name} status=${status}"
            if [ "${status}" = "404" ]; then
              echo "agent=${name} already absent"
              return 0
            fi
            python3 -c "import pathlib; print(pathlib.Path('/tmp/delete-${name}.json').read_text()[:1500])"
            if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
              return 1
            fi
          }

          for agent in web-search-agent hr-assistant-agent weather-agent; do
            if ! delete_agent "${agent}"; then
              echo "failed deleting agent=${agent}"
              failed=1
            fi
          done

          status=$(curl -sS -o /tmp/memory-delete.json -w "%{http_code}" \
            -X DELETE "${endpoint}/memory_stores/${MEMORY_STORE_NAME}?api-version=v1" \
            -H "api-key: ${FOUNDRY_API_KEY}" \
            -H "${FEATURE_HEADER}" \
            -H "Accept: application/json")
          echo "memory_store=${MEMORY_STORE_NAME} status=${status}"
          if [ "${status}" = "404" ]; then
            echo "memory store already absent"
          else
            python3 -c 'import pathlib; print(pathlib.Path("/tmp/memory-delete.json").read_text()[:2000])'
            if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
              failed=1
            fi
          fi

          if [ "${failed}" -ne 0 ]; then
            echo "One or more deletes failed."
            exit 1
          fi
          echo "Project soft teardown complete (agents + memory)."
