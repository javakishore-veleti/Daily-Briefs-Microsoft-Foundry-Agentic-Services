name: AzureFoundry-004-Agent-Weather-Create

on:
  workflow_dispatch:
    inputs:
      model_deployment:
        description: Model deployment the weather agent should use
        required: true
        type: choice
        default: gpt-4.1
        options:
          - gpt-4.1
          - gpt-4o
          - gpt-5-mini
          - gpt-5.4-mini
      still_run:
        description: Agent Created Already In Code, Do You Still Run This Github Action?
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: foundry-weather-agent
  cancel-in-progress: false

jobs:
  create:
    name: Create weather-agent
    if: inputs.still_run == 'yes'
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
      MODEL_DEPLOYMENT: ${{ inputs.model_deployment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create agent version
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FOUNDRY_PROJECT_ENDPOINT}" ] || [ -z "${FOUNDRY_API_KEY}" ]; then
            echo "Add FOUNDRY_PROJECT_ENDPOINT and FOUNDRY_API_KEY as repository secrets."
            exit 1
          fi
          endpoint="${FOUNDRY_PROJECT_ENDPOINT%/}"
          instructions="You are a weather agent. Answer weather questions, including follow-ups in this conversation. Follow-up weather questions use the place already named in this conversation. When a city, state, or country is known, call the weather tool for that place. Answer rain, temperature, wind, humidity, and forecast questions for that place. Ask for a city only when no place has been named in this conversation. If the question is not about the weather, say that you only answer weather questions. Do not search the web and do not answer questions about people."
          SPEC_PATH="middleware/adapters/azure/ms_foundry/weather_info/weather_openapi.json"
          case "${MODEL_DEPLOYMENT}" in
            gpt-4.1|gpt-4o)
              definition=$(printf '%s' "${instructions}" | MODEL_DEPLOYMENT="${MODEL_DEPLOYMENT}" SPEC_PATH="${SPEC_PATH}" python3 -c "import json,os,sys; instructions=sys.stdin.read(); spec=json.load(open(os.environ['SPEC_PATH'], encoding='utf-8')); print(json.dumps({'definition': {'kind': 'prompt', 'model': os.environ['MODEL_DEPLOYMENT'], 'instructions': instructions, 'tools': [{'type': 'openapi', 'openapi': {'name': 'weather', 'spec': spec, 'auth': {'type': 'anonymous'}}}]}}))")
              ;;
            gpt-5-mini|gpt-5.4-mini)
              definition=$(printf '%s' "${instructions}" | MODEL_DEPLOYMENT="${MODEL_DEPLOYMENT}" SPEC_PATH="${SPEC_PATH}" python3 -c "import json,os,sys; instructions=sys.stdin.read(); spec=json.load(open(os.environ['SPEC_PATH'], encoding='utf-8')); print(json.dumps({'definition': {'kind': 'prompt', 'model': os.environ['MODEL_DEPLOYMENT'], 'instructions': instructions, 'tools': [{'type': 'openapi', 'openapi': {'name': 'weather', 'spec': spec, 'auth': {'type': 'anonymous'}}}], 'reasoning': {'effort': 'minimal'}}}))")
              ;;
            *)
              echo "Unsupported model deployment: ${MODEL_DEPLOYMENT}"
              exit 1
              ;;
          esac
          status=$(curl -sS -o /tmp/agent-create.json -w "%{http_code}" \
            -X POST "${endpoint}/agents/weather-agent/versions?api-version=v1" \
            -H "api-key: ${FOUNDRY_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data "${definition}")
          echo "model=${MODEL_DEPLOYMENT} status=${status}"
          python3 -c "import pathlib; print(pathlib.Path('/tmp/agent-create.json').read_text()[:2000])"
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            exit 1
          fi
