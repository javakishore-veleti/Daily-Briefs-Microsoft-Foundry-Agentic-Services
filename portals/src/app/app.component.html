<div class="shell">
  <aside class="rail">
    <p class="brand">Daily Briefs</p>
    <p class="brand-note">Foundry portals</p>
    <nav class="menu" aria-label="Briefs">
      @for (menu of menus; track menu.id) {
        <a
          [routerLink]="['/', menu.id]"
          routerLinkActive="menu-active"
          class="menu-link"
        >
          {{ menu.label }}
        </a>
      }
    </nav>
  </aside>
  <main class="stage">
    <router-outlet />
  </main>
</div>
