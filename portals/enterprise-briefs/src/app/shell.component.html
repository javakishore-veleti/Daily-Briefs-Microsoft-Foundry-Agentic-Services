<div class="shell">
  <aside class="rail">
    <p class="brand">Enterprise Briefs</p>
    <p class="brand-note">{{ user()?.email }}</p>
    <nav class="menu" aria-label="Briefs">
      @for (menu of menus; track menu.id) {
        <a [routerLink]="['/', menu.id]" routerLinkActive="menu-active" class="menu-link">
          {{ menu.label }}
        </a>
      }
      <a routerLink="/profile" routerLinkActive="menu-active" class="menu-link">Profile</a>
      <button type="button" class="menu-link sign-out" (click)="signOut()">Sign out</button>
    </nav>
  </aside>
  <main class="stage">
    <router-outlet />
  </main>
</div>
